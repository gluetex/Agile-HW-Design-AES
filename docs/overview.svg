<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2328"/>
    </marker>
  </defs>
  <rect width="960" height="400" rx="10" fill="#ffffff"/>

  <!-- Mode wrapper -->
  <rect x="130" y="20" width="700" height="360" rx="10" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="146" y="44" font-size="13" fill="#4b5563" font-weight="bold">Mode wrapper: ECB · CBC · CFB · OFB</text>

  <!-- Inputs -->
  <text x="20" y="92" font-size="14" font-weight="bold" fill="#1f2328">key</text>
  <text x="20" y="110" font-size="11" fill="#4b5563">128/192/256 bit</text>
  <line x1="110" y1="96" x2="160" y2="96" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>

  <text x="20" y="184" font-size="14" font-weight="bold" fill="#1f2328">data in</text>
  <text x="20" y="206" font-size="11" fill="#4b5563">128-bit block</text>

  <text x="20" y="332" font-size="14" font-weight="bold" fill="#1f2328">IV</text>
  <text x="20" y="350" font-size="11" fill="#4b5563">modes only</text>
  <line x1="100" y1="338" x2="440" y2="338" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- KeyExpansion -->
  <rect x="160" y="60" width="170" height="72" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="245" y="92" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f2328">KeyExpansion</text>
  <text x="245" y="112" font-size="11" text-anchor="middle" fill="#4b5563">combinational</text>
  <line x1="330" y1="96" x2="420" y2="96" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="375" y="88" font-size="11" text-anchor="middle" fill="#4b5563">round keys</text>

  <!-- Cipher core -->
  <rect x="420" y="60" width="380" height="220" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="1.8"/>
  <text x="436" y="86" font-size="15" font-weight="bold" fill="#1f2328">Cipher core: AESEncrypt / AESDecrypt</text>
  <text x="436" y="106" font-size="11" fill="#4b5563">one round per clock cycle · Nr+1 cycles per block</text>

  <rect x="440" y="130" width="90" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="485" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">State</text>
  <text x="485" y="204" font-size="12" text-anchor="middle" fill="#4b5563">register</text>

  <rect x="570" y="130" width="210" height="120" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="675" y="154" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Round logic</text>
  <text x="675" y="178" font-size="12" text-anchor="middle" fill="#1f2328">SubBytes</text>
  <text x="675" y="196" font-size="12" text-anchor="middle" fill="#1f2328">ShiftRows</text>
  <text x="675" y="214" font-size="12" text-anchor="middle" fill="#1f2328">MixColumns</text>
  <text x="675" y="232" font-size="12" text-anchor="middle" fill="#1f2328">AddRoundKey</text>

  <line x1="530" y1="160" x2="570" y2="160" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="570" y1="226" x2="530" y2="226" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- data in arrow drawn on top of core -->
  <line x1="100" y1="192" x2="440" y2="192" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- Data out -->
  <line x1="780" y1="192" x2="945" y2="192" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="846" y="180" font-size="14" font-weight="bold" fill="#1f2328">data out</text>
  <text x="846" y="210" font-size="11" fill="#4b5563">128-bit block</text>

  <!-- Mode logic -->
  <rect x="440" y="310" width="340" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="610" y="333" font-size="13" font-weight="bold" text-anchor="middle" fill="#1f2328">Mode logic (CBC / CFB / OFB)</text>
  <text x="610" y="353" font-size="11" text-anchor="middle" fill="#4b5563">XOR with IV or previous block</text>
  <line x1="560" y1="280" x2="560" y2="310" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="660" y1="310" x2="660" y2="280" stroke="#1f2328" stroke-width="1.6" marker-end="url(#a)"/>
</svg>
